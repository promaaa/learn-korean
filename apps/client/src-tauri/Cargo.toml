[package]
name = "learn-korean"
description = "Keyboard-first Korean learning app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "learn_korean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false }
korean-core = { path = "../../../crates/korean-core" }
korean-db = { path = "../../../crates/korean-db" }
korean-providers = { path = "../../../crates/korean-providers" }
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[lints]
workspace = true
